name: 네이버 블로그 자동 발행

on:
  schedule:
    # 매일 오전 9시 (UTC+9 기준으로는 자동 변환)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chrome 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: config.json 생성
        run: |
          cat > config.json << 'EOF'
          {
            "headless": true,
            "blog_id": "${{ secrets.NAVER_BLOG_ID }}",
            "blog_url": "https://blog.naver.com/${{ secrets.NAVER_BLOG_ID }}",
            "dry_run": false
          }
          EOF

      - name: 자동 발행 실행
        run: |
          python auto_post.py || true

      - name: 실행 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: debug_dom.html
          retention-days: 7
